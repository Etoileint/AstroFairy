format = 1

[architecture]
core_files = ["skills/fairy/scripts/astrofairy/_contracts.py", "skills/fairy/scripts/astrofairy/_kernel.py", "skills/fairy/scripts/astrofairy/_store.py", "skills/fairy/scripts/astrofairy/_runtime.py"]

[tests]
pattern = "test*.py"

[[tests.surfaces]]
path = "skills/fairy/scripts/astrofairy/tests"
top = "skills/fairy/scripts"

[[tests.surfaces]]
path = "dev/tests"
top = "."

[checks]
commands = [
  ["dev/check_work_program.py"],
  ["dev/check_vendor.py"],
  ["dev/check_model_profile.py"],
  ["dev/lock_runtime.py", "--check"],
  ["dev/lock_search.py", "--check"],
  ["dev/sync_metadata.py", "--check"],
  ["-m", "skills_ref.cli", "validate", "skills/fairy"],
  ["-m", "ruff", "check", "."],
  ["-m", "ruff", "format", "--check", "."],
  ["-m", "mypy"],
]
