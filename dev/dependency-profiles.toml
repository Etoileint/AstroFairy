format = 1

# One development lock orchestrator. Profiles declare roots, outputs and the
# frozen PyPI metadata catalog used by the offline check. uv performs universal
# resolution; this file never lists a transitive inventory by hand.

[policy]
index_url = "https://pypi.org/simple"
only_binary = ":all:"
python_from = "pyproject.toml"
uv_pin_file = "requirements-dev.lock"
uv_pin_name = "uv"

# Declared check environments for the offline closure audit. The lock must
# contain every dependency that is active in at least one of these
# (platform, interpreter) cells. Over-inclusion is allowed; omission is not.
python_versions = ["3.12", "3.13", "3.14", "3.15"]
platforms = ["linux", "win32", "darwin"]
machines = { linux = ["x86_64", "aarch64"], win32 = ["AMD64", "arm64"], darwin = ["x86_64", "arm64"] }

[[profile]]
name = "core"
roots = "pyproject.toml"
lock = "skills/fairy/scripts/requirements-runtime.lock"
snapshots = "dev/runtime_snapshots"

[[profile]]
name = "search"
roots = "dev/search-requirements.in"
lock = "skills/fairy/scripts/requirements-search.lock"
snapshots = "dev/search_snapshots"

[diagnostics]
path = "skills/fairy/scripts/astrofairy/_dependency_manifest.json"
