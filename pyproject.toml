[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrofairy"
dynamic = ["version"]
description = "Structured AI task delivery with traceable checks and reusable workflows"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Etoileint"}]
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.scripts]
astrofairy = "astrofairy._cli:main"

[tool.setuptools.dynamic]
version = {attr = "astrofairy._version.__version__"}

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["skills/astrofairy/scripts"]
include = ["astrofairy*"]
exclude = ["astrofairy.tests*"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D", # Short internal modules use names and contracts rather than boilerplate docstrings.
  "ANN401", # The JSON protocol boundary contains heterogeneous values.
  "TRY003", "EM101", "EM102", # Structured FairyError codes identify protocol failures.
  "COM812", # Formatting owns trailing commas.
  "CPY001", # Repository LICENSE carries attribution; no repeated file headers.
  "TRY300", "TRY301", # Boundary validation and transaction results stay next to the protected operations.
  "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", # Protocol dispatch is explicit and table-validated.
  "PLR2004", # Protocol constants and test examples are local and named by context.
  "S603", # Development subprocesses use argument arrays, never a shell.
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"skills/astrofairy/scripts/astrofairy/tests/**" = ["S101", "SLF001", "PLR0914", "PT009", "PT027"] # Standard-library unittest assertions.
"dev/**" = ["T201", "INP001"]
"dev/tests/**" = ["PT009", "PT027"] # Standard-library unittest assertions.
"skills/astrofairy/scripts/fairy.py" = ["INP001", "E402"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
files = ["skills/astrofairy/scripts/astrofairy"]
exclude = ["skills/astrofairy/scripts/astrofairy/tests/"]
